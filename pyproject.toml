[project]
name = "cardiacudc-segmentation"
version = "0.1.0"
description = "Reproducible data inspection and segmentation experiments for CardiacUDC cardiac ultrasound"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "nibabel>=5,<6",
    "nnunetv2>=2.8,<3",
    "numpy>=2,<3",
    "torch>=2.5,<3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<8",
    "nbclient>=0.10,<1",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
]

[tool.uv]
package = false
